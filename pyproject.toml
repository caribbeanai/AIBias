[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibias"
version = "0.1.0"
description = "Detect, quantify, and mitigate bias in AI-generated content (text & images)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "starapple", email = "founder@starapple.ai" }]
keywords = ["ai", "bias", "fairness", "responsible-ai", "llm", "audit", "nlp", "vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
images = ["opencv-python>=4.8", "numpy>=1.24"]
sentiment = ["vaderSentiment>=3.3"]
all = ["opencv-python>=4.8", "numpy>=1.24", "vaderSentiment>=3.3"]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
aibias = "aibias.cli:main"

[project.urls]
Homepage = "https://github.com/caribbeanai/aibias"

[tool.setuptools.packages.find]
include = ["aibias*"]
